# OpenSurround PoC config
# Each endpoint maps 1 (mono) or 2 (stereo) source channels from the input WAV
# to one Sendspin client (matched by name substring).

[server]
name = "OpenSurround PoC"
host = "0.0.0.0"
port = 8927
auto_trust_unpaired = true   # trusted-LAN test only!
# Keep false for lab testing: persisted pairing records make unencrypted
# transition-mode clients (Kiosk Satellite) get rejected on the next run.
persist_pairings = false

[audio]
chunk_ms = 20
# How far ahead of real-time the server streams before pacing kicks in.
# Higher = more robust against Wi-Fi jitter, but more end-to-end latency.
buffer_lead_ms = 1000

[endpoints.front]
match_name = "REPLACE-ME-DEVICE-A"
source_channels = [0, 1]
gain_db = 0.0     # -12 .. +12 typical; clips at 0 dBFS
delay_ms = 0.0    # positive only; shifts this endpoint later on the shared timeline

[endpoints.rear]
match_name = "REPLACE-ME-DEVICE-B"
source_channels = [2, 3]
gain_db = 0.0
delay_ms = 0.0

